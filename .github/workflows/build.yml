name: Deploy Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "docs-pages"
  cancel-in-progress: false

jobs:
  validate-kdl:
    name: Validate KDL snippets
    runs-on: ubuntu-latest
    env:
      # Pinned Zentinel release the snippets are checked against. Bump both
      # together when documenting a newer release.
      ZENTINEL_RELEASE: "26.10_7"
      ZENTINEL_SHA256: "e772f659786606cfc7881cafb52da2b4b292df3351e7676621f168a2384f3f0c"
    steps:
      - uses: actions/checkout@v4

      - name: Install Zentinel ${{ env.ZENTINEL_RELEASE }}
        run: |
          set -euo pipefail
          archive="zentinel-${ZENTINEL_RELEASE}-linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/zentinelproxy/zentinel/releases/download/${ZENTINEL_RELEASE}/${archive}"
          echo "${ZENTINEL_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zentinel"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/zentinel"
          # Archives before 26.10_4 did not carry the executable bit (zentinel#519).
          chmod +x "$RUNNER_TEMP/zentinel/zentinel"
          "$RUNNER_TEMP/zentinel/zentinel" --version
          echo "ZENTINEL_BIN=$RUNNER_TEMP/zentinel/zentinel" >> "$GITHUB_ENV"

      # Every ```kdl block must load, validate and lint without an
      # "is being ignored" warning; ```fragment,kdl blocks are skipped.
      # See scripts/check_kdl.py for the convention.
      - name: Validate KDL snippets
        run: python3 scripts/check_kdl.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Check internal links
        run: python3 scripts/check_links.py content

      - name: Build documentation
        run: mise run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: docs-build
          path: public
          retention-days: 7

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, validate-kdl]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
